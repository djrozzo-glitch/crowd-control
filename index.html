<!doctype html><html lang="en"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Crowd Control</title><style>
*{box-sizing:border-box}body{margin:0;background:#10151d;color:#f5f1e9;font-family:Arial,sans-serif}main{max-width:1100px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:end;gap:15px}.tag{color:#fbcc65;font-size:11px;letter-spacing:.22em;font-weight:bold}h1{font-size:clamp(34px,6vw,65px);line-height:.9;letter-spacing:-.06em;margin:10px 0}p{color:#a6b1b8;line-height:1.4;margin:8px 0}.stats{display:flex;gap:24px;text-align:right}.stats b{display:block;font-size:24px;color:#f8d877}.stats span{font-size:10px;color:#a6b1b8;letter-spacing:.12em}canvas{width:100%;display:block;background:#202c30;border:1px solid #52635e;border-radius:8px;touch-action:none;margin-top:20px}.bottom{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-top:15px}.button,button{background:#f5cb6b;color:#171d1e;border:0;border-radius:5px;padding:13px 20px;font-weight:800;cursor:pointer}.controls{display:grid;grid-template-columns:repeat(3,48px);gap:4px}.controls button{padding:10px;background:#34443f;color:white}.controls .empty{visibility:hidden}.hint{font-size:13px}.notice{color:#f7cf75;font-weight:bold;min-height:20px}@media(max-width:600px){main{padding:14px}.stats{gap:10px}.stats b{font-size:18px}.bottom{align-items:start}h1{font-size:38px}}
</style><main><div class="top"><div><div class="tag">FESTIVAL SECURITY / NIGHT SHIFT 01</div><h1>CROWD CONTROL</h1><p>Keep the festival moving. Contain the trouble.</p></div><div class="stats"><div><b id="caught">0 / 3</b><span>ISOLATED</span></div><div><b id="lives">♥ ♥ ♥</b><span>TEAM</span></div><div><b id="area">0%</b><span>SECURED</span></div></div></div><canvas id="game" width="900" height="560"></canvas><div class="bottom"><div><div class="notice" id="notice">Use arrows or WASD to move.</div><p class="hint">Leave the safe perimeter and reconnect to complete a cordon.<br>Isolate all red troublemakers. Don't let them touch an unfinished line.</p><button id="restart">RESTART SHIFT</button></div><div class="controls"><button class="empty"></button><button data-d="up">▲</button><button class="empty"></button><button data-d="left">◀</button><button data-d="down">▼</button><button data-d="right">▶</button></div></div></main><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),W=45,H=28,S=20;let grid,player,trail,enemies,guests,lives,caught,over,dir,tick=0,flash=0;
const notice=document.querySelector('#notice');function init(){grid=Array.from({length:H},(_,y)=>Array.from({length:W},(_,x)=>x===0||y===0||x===W-1||y===H-1?1:0));player={x:22,y:0};trail=[];enemies=Array.from({length:3},(_,i)=>({x:8+i*13,y:8+i*5,dx:Math.random()>.5?1:-1,dy:Math.random()>.5?1:-1}));guests=Array.from({length:95},()=>({x:1+Math.random()*43,y:1+Math.random()*26,c:['#cdbb9f','#9dbdb6','#cf927f','#c2aa70'][Math.random()*4|0]}));lives=3;caught=0;over=false;dir=null;update();notice.textContent='Use arrows or WASD to move.'}
function update(){document.querySelector('#caught').textContent=caught+' / 3';document.querySelector('#lives').textContent='♥ '.repeat(lives);document.querySelector('#area').textContent=Math.round(grid.flat().filter(v=>v===1).length/(W*H)*100)+'%'}
function fail(){if(over)return;lives--;trail.forEach(p=>grid[p.y][p.x]=0);trail=[];player={x:22,y:0};dir=null;flash=20;notice.textContent=lives?'Cordon breached! Regroup and try again.':'Shift over. The crowd broke through.';if(!lives)over=true;update()}
function seal(){trail.forEach(p=>grid[p.y][p.x]=1);trail=[];let seen=Array.from({length:H},()=>Array(W).fill(false)),regions=[];for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){if(grid[y][x]||seen[y][x])continue;let q=[[x,y]],cells=[];seen[y][x]=true;for(let i=0;i<q.length;i++){let [a,b]=q[i];cells.push([a,b]);for(let [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){let nx=a+dx,ny=b+dy;if(nx>=0&&nx<W&&ny>=0&&ny<H&&!grid[ny][nx]&&!seen[ny][nx]){seen[ny][nx]=true;q.push([nx,ny])}}}regions.push(cells)}if(regions.length>1){regions.sort((a,b)=>b.length-a.length);for(let cells of regions.slice(1)){let set=new Set(cells.map(p=>p.join(',')));for(let e of enemies)if(set.has([Math.floor(e.x),Math.floor(e.y)].join(','))){e.caught=true;caught++}cells.forEach(([x,y])=>grid[y][x]=1)}enemies=enemies.filter(e=>!e.caught);notice.textContent=caught===3?'All troublemakers isolated. Festival secured!':'Cordon complete. Keep going!';if(caught===3)over=true}else notice.textContent='Cordon complete. Split the crowd to isolate troublemakers.';update()}
function move(){if(!dir||over)return;let [dx,dy]=dir,nx=player.x+dx,ny=player.y+dy;if(nx<0||ny<0||nx>=W||ny>=H)return;if(grid[ny][nx]===2){fail();return}player={x:nx,y:ny};if(grid[ny][nx]===0){grid[ny][nx]=2;trail.push({x:nx,y:ny})}else if(trail.length)seal()}
function frame(){tick++;if(tick%6===0)move();if(!over){for(let e of enemies){let speed=.047,nx=e.x+e.dx*speed,ny=e.y+e.dy*speed;if(nx<1||nx>=W-1||grid[Math.floor(e.y)][Math.floor(nx)]===1)e.dx*=-1;else e.x=nx;if(ny<1||ny>=H-1||grid[Math.floor(ny)][Math.floor(e.x)]===1)e.dy*=-1;else e.y=ny;if(grid[Math.floor(e.y)][Math.floor(e.x)]===2||Math.hypot(e.x-player.x-.5,e.y-player.y-.5)<.65&&trail.length)fail()}for(let g of guests){g.x+=Math.sin(tick*.015+g.y)*.008;g.y+=Math.cos(tick*.012+g.x)*.008}}
ctx.fillStyle=flash-->0?'#4a302e':'#263735';ctx.fillRect(0,0,900,560);for(let y=0;y<H;y++)for(let x=0;x<W;x++){if(grid[y][x]===1){ctx.fillStyle='#45675b';ctx.fillRect(x*S,y*S,S,S)}if(grid[y][x]===2){ctx.fillStyle='#f7d36c';ctx.fillRect(x*S+3,y*S+3,14,14)}}ctx.fillStyle='#1a2527';ctx.fillRect(350,70,200,45);ctx.fillStyle='#a5c9bd';ctx.font='bold 13px Arial';ctx.textAlign='center';ctx.fillText('MAIN STAGE',450,97);for(let g of guests){if(grid[Math.floor(g.y)]?.[Math.floor(g.x)]!==0)continue;ctx.fillStyle=g.c;ctx.beginPath();ctx.arc(g.x*S,g.y*S,3,0,7);ctx.fill()}for(let e of enemies){ctx.fillStyle='#ef6260';ctx.beginPath();ctx.arc(e.x*S,e.y*S,8,0,7);ctx.fill();ctx.strokeStyle='#ffb1a0';ctx.stroke();ctx.fillStyle='white';ctx.font='bold 11px Arial';ctx.fillText('!',e.x*S,e.y*S+4)}ctx.fillStyle='#f8d36d';ctx.beginPath();ctx.arc(player.x*S+10,player.y*S+10,8,0,7);ctx.fill();ctx.strokeStyle='white';ctx.lineWidth=2;ctx.stroke();ctx.lineWidth=1;requestAnimationFrame(frame)}
const dirs={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};document.addEventListener('keydown',e=>{let d=dirs[e.key];if(d){e.preventDefault();dir=d}});document.querySelectorAll('[data-d]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();dir={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[b.dataset.d]}));document.querySelector('#restart').onclick=init;init();frame();
</script></html>
